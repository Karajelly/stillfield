name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Where did it happen?
      options:
        - Web (browser)
        - Native iPhone
        - Native iPad
        - Web installed to the home screen
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, OS version, and browser
      placeholder: "iPad Air, iPadOS 18.2, Safari"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or recordings
      description: Optional, but they help a lot.
