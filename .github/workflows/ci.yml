name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no secrets are used by these jobs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  swift-core:
    name: Swift core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test --package-path ios/StillfieldCore

  ios-app:
    name: iOS app and UI tests (simulator build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      # Compiles the app and its UI tests without running them. Unsigned, and
      # quiet so the log holds only warnings and errors.
      - run: >
          xcodebuild -project ios/Stillfield.xcodeproj -scheme Stillfield
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/.build -quiet build-for-testing CODE_SIGNING_ALLOWED=NO
