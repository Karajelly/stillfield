name: Native look (temporary)

# Temporary, and removed before this pull request is ready: runs two UI tests in
# a simulator and keeps their screenshots, so the native day, night lights, and
# postcards can be looked at from an environment that has no Xcode.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/native-look.yml"

permissions:
  contents: read

concurrency:
  group: native-look-${{ github.ref }}
  cancel-in-progress: true

jobs:
  look:
    name: Native look (temporary)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: List simulators
        run: xcrun simctl list devices available | grep -E "iPhone|iPad" | head -30
      - name: Run the night and settings UI tests
        continue-on-error: true
        run: >
          xcodebuild -project ios/Stillfield.xcodeproj -scheme Stillfield
          -destination 'platform=iOS Simulator,name=iPhone 16'
          -derivedDataPath ios/.build -resultBundlePath look.xcresult
          -only-testing:StillfieldUITests/StillfieldUITests/testNightLightsAndAPostcard
          -only-testing:StillfieldUITests/StillfieldUITests/testNativeToolsSettingsAndPause
          -quiet test CODE_SIGNING_ALLOWED=NO
      - name: Summarize and export screenshots
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path look.xcresult | head -80 || true
          xcrun xcresulttool export attachments --path look.xcresult --output-path shots || true
          ls -la shots || true
          cat shots/manifest.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: native-look
          path: shots
      # The artifact above holds the full-size screenshots. These small copies
      # go in the log because the environment reviewing this run can read job
      # logs but cannot download artifacts.
      - name: Print small copies of the screenshots
        if: always()
        run: |
          python3 - <<'PY'
          import base64, json, subprocess
          wanted = {
              "A quiet, bright night": 180,
              "A postcard of the night meadow": 180,
              "A soft pink dusk": 150,
              "Native settings": 140,
              "Welcome to Willowbrook": 140,
          }
          seen = set()
          for test in json.load(open("shots/manifest.json")):
              for attachment in test["attachments"]:
                  name = attachment["suggestedHumanReadableName"].split("_0_")[0]
                  if name not in wanted or name in seen:
                      continue
                  seen.add(name)
                  subprocess.run(
                      ["sips", "--resampleWidth", str(wanted[name]), "-s", "format", "jpeg",
                       "-s", "formatOptions", "40", "shots/" + attachment["exportedFileName"],
                       "--out", "small.jpg"],
                      check=True, stdout=subprocess.DEVNULL)
                  data = base64.b64encode(open("small.jpg", "rb").read()).decode()
                  print(f"=====BEGIN {name}")
                  for start in range(0, len(data), 2000):
                      print(data[start:start + 2000])
                  print("=====END")
          PY
